name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

      - name: Rodar testes unitários com cobertura
        run: npm run coverage

      - name: Enviar cobertura para o Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: reports/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Rodar testes de integração
        run: npm test

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: reports/cucumber-report.html
          retention-days: 15
